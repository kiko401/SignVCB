name: moyu_app
description: 默语共鸣 - 听障儿童无障碍沟通与学习应用
publish_to: 'none'
version: 3.3.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  record: ^7.1.1
  just_audio: ^0.9.37
  rive: ^0.13.0
  flutter_svg: ^2.0.0
  permission_handler: ^11.3.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
    - assets/svg/yuyu/
    - assets/svg/icons/
    - assets/svg/word_cards/
    - assets/svg/covers/
    - assets/svg/nodes/
    - assets/svg/deco/

flutter_gen:
  output: lib/generated/
  integrations:
    rive: true
    flutter_svg: true
